name: 复刻反馈 / Iteration Case
description: Submit a generated-video failure, success case, or reusable skill improvement.
title: "[Iteration] "
labels: ["iteration-case"]
body:
  - type: input
    id: product_category
    attributes:
      label: 产品类别
      description: 例如护膝、窗膜、香水、清洁片、健身平台、球衣。
    validations:
      required: true
  - type: input
    id: target_platform
    attributes:
      label: 目标平台 / 视频模型
      description: 例如 TikTok Shop、Seedance、Kling、Runway、Pika、即梦。
    validations:
      required: false
  - type: textarea
    id: prompt_used
    attributes:
      label: 使用的提示词
      description: 粘贴用于生成失败/成功视频的提示词。
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 原片信息
      description: 描述原片，或提供你有权分享的链接/截图/contact sheet。不要上传无授权素材。
    validations:
      required: true
  - type: textarea
    id: generated_attempt
    attributes:
      label: 生成片信息
      description: 描述生成结果，或提供你有权分享的链接/截图/contact sheet。
    validations:
      required: true
  - type: textarea
    id: observed_failure
    attributes:
      label: 具体问题
      description: 说明画面、音频、前三秒、产品卖点、物理正确性、人物/场景真实感等哪里出了问题。
    validations:
      required: true
  - type: textarea
    id: reusable_rule
    attributes:
      label: 你认为可复用的规则
      description: 如果你已经有想法，请写出可跨产品复用的规则；没有也可以留空。
    validations:
      required: false
  - type: checkboxes
    id: rights
    attributes:
      label: 素材与隐私确认
      options:
        - label: 我没有公开上传无授权原始视频、隐私素材或客户文件。
          required: true
        - label: 我理解维护者可能只把这个案例作为抽象规则或 eval，不会收录完整素材。
          required: true
